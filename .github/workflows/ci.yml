name: CI

# spatcore has no app of its own, so CI builds the minimal consumer example
# (examples/minimal-app). It fetches its own JUCE + juce_simpleweb, so it
# exercises the CMake-native consumer contract standalone — including the
# Apple OBJCXX / Metal-backend compile path that regressed the first real
# consumer (XOA) before this guard existed.

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example:
    name: minimal-app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025,  name: windows }
          - { os: macos-latest,  name: macos }
          - { os: ubuntu-latest, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE build deps (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          # Audio-only example, but JUCE's juceaide build tool links
          # juce_gui_basics, which needs the X11 dev headers (Xrandr / Xinerama
          # / Xcursor). The app CIs get these transitively via libgtk-3-dev.
          sudo apt-get install -y build-essential cmake pkg-config libasound2-dev \
              libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev \
              libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev

      # The five gpu/Metal*Backend.mm are compiled in TWO ObjC memory modes and
      # must build in both:
      #   non-ARC  the app (JUCE's pbxproj sets no CLANG_ENABLE_OBJC_ARC) and
      #            this example (CMake defaults ARC off)
      #   ARC      the Experiments/metal-*-test harnesses, which pass -fobjc-arc
      #
      # Nothing below catches the ARC leg: the minimal-app build exercises only
      # the non-ARC one. That gap let a real bug live for weeks -- a lambda
      # taking id<MTLBuffer> BY REFERENCE is fine without ARC, but under ARC the
      # parameter defaults to __autoreleasing while callers pass __strong, which
      # is a hard error. It broke MetalObBackend + MetalWfsBackend (3 and 4
      # errors) and was invisible to every build in every repo.
      #
      # -fsyntax-only, so no Metal device and no link step: runs in seconds on
      # any macOS runner and needs neither JUCE nor CMake.
      - name: Metal backends compile under ARC and non-ARC
        if: matrix.name == 'macos'
        run: |
          set -euo pipefail
          echo "== non-ARC (app + minimal-app) =="
          clang++ -std=c++17 -DWFS_GPU_NATIVE=1 -I gpu -fsyntax-only gpu/Metal*Backend.mm
          echo "== ARC (Experiments harnesses) =="
          clang++ -std=c++17 -fobjc-arc -DWFS_GPU_NATIVE=1 -I gpu -fsyntax-only gpu/Metal*Backend.mm

      - name: Configure
        run: cmake -S examples/minimal-app -B examples/minimal-app/build -DCMAKE_BUILD_TYPE=Debug

      - name: Build (Debug)
        run: cmake --build examples/minimal-app/build --config Debug --parallel
